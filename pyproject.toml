[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "plc-logic-verifier"
version = "0.1.0"
description = "Deterministic local verification of a defined Structured Text subset"
requires-python = ">=3.12"
dependencies = ["lark==1.3.1", "PyYAML==6.0.3", "pydantic==2.12.4"]

[project.optional-dependencies]
ai = ["openai==2.8.0"]

[dependency-groups]
dev = ["pytest==9.0.1", "ruff==0.14.5", "mypy==1.18.2", "types-PyYAML==6.0.12.20250915"]

[project.scripts]
plc-verifier = "plc_verifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plc_verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
