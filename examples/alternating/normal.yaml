id: alternating-normal
description: 'Caso alternating: normal'
program: correct.st
duration_ms: 1000
scan_ms: 100
initial:
  Available1: true
  Available2: true
events:
- scan: 0
  set:
    Demand: true
- scan: 3
  set:
    Demand: false
- scan: 5
  set:
    Demand: true
- scan: 8
  set:
    Demand: false
requirements:
- id: B01
  kind: hold
  description: Principal inicial P1
  expr: P1 AND NOT P2
  start_ms: 0
  end_ms: 200
- id: B04
  kind: hold
  description: Alternancia a P2
  expr: P2 AND NOT P1
  start_ms: 500
  end_ms: 700
- id: B02
  kind: mutex
  description: Exclusión mutua
  steps:
  - P1
  - P2
- id: B05
  kind: never
  description: Sin demanda ambas apagadas
  when: NOT Demand
  expr: P1 OR P2
